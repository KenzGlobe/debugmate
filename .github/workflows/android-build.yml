name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-29" "build-tools;29.0.3" "platform-tools"

      - name: Switch to Java 8 for Android Gradle Plugin 3.5.4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install compatible Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '5.4.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugMate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
