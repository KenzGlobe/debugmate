name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Current Android command-line tools require JDK 17+
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project Android SDK components
        run: |
          sdkmanager "platforms;android-21" "build-tools;21.1.0" "extras;android;m2repository"

      # This project uses Android Gradle Plugin 1.x / Gradle 2.14.1,
      # which must run on Java 8 rather than the current JDK.
      - name: Switch to Java 8 for legacy Android Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install compatible Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '2.14.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugMate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
