<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #1E1E1E; color: #E6E6E6; font-family: monospace; padding: 16px; line-height: 1.6; }
        h1 { color: #8B5CF6; border-bottom: 2px solid #8B5CF6; padding-bottom: 8px; }
        h2 { color: #3FB950; }
        .card { background-color: #262626; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        a { color: #58A6FF; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h1>UI Elements</h1>
    <p>UI (User Interface) Elements are the building blocks of any app screen. In Android, they are called <b>Views</b>.</p>
    
    <div class="card">
        <h2>TextView</h2>
        <p>Displays text on the screen.</p>
    </div>
    
    <div class="card">
        <h2>Button</h2>
        <p>A clickable UI element that triggers an action.</p>
    </div>
    
    <p>To see how to code a TextView, check out the <a href="cheat://android">Android Cheat Sheet</a>.</p>
</body>
</html>
